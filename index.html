<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duty Map">
<meta name="theme-color" content="#0b2545">
<title>SISD Duty Map</title>
<style>
:root{
  --navy:#0b2545; --navy2:#13315c; --ink:#0f172a; --line:#e2e8f0;
  --bg:#f1f5f9; --card:#ffffff; --muted:#64748b;
  --green:#16a34a; --greenbg:#dcfce7; --red:#dc2626; --redbg:#fee2e2;
  --amber:#d97706; --amberbg:#fef3c7; --blue:#2563eb; --bluebg:#dbeafe;
  --shadow:0 1px 3px rgba(15,23,42,.10),0 1px 2px rgba(15,23,42,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;box-shadow:var(--shadow)}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:#38bdf8;box-shadow:0 0 8px #38bdf8}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock .t{font-size:18px;font-weight:700}
.clock .d{font-size:11px;opacity:.8}
.statusbar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff}
.pill.live{background:#16a34a}
.pill.soon{background:#d97706}
.pill.off{background:rgba(255,255,255,.16)}
.weekpill{background:rgba(255,255,255,.16)}
/* Prev / Now / Next switcher */
.switch{display:flex;gap:6px;margin-top:10px;background:rgba(255,255,255,.10);padding:4px;border-radius:12px}
.switch button{flex:1;border:0;background:transparent;color:#cbd5e1;font:inherit;font-weight:600;
  font-size:13px;padding:8px 6px;border-radius:9px;cursor:pointer;line-height:1.2}
.switch button .lab{display:block;font-size:11px;opacity:.75;font-weight:600}
.switch button .val{display:block;font-size:13px;font-weight:700;color:#fff}
.switch button[aria-selected="true"]{background:#fff}
.switch button[aria-selected="true"] .lab{color:var(--navy);opacity:.7}
.switch button[aria-selected="true"] .val{color:var(--navy)}
.slotline{margin-top:8px;font-size:12.5px;color:#dbeafe;text-align:center;font-weight:500}
main{max-width:760px;margin:0 auto;padding:12px 12px 120px}
.summary{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.scard{flex:1;min-width:80px;background:var(--card);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);text-align:center}
.scard b{display:block;font-size:20px;line-height:1.1}
.scard span{font-size:11px;color:var(--muted)}
.scard.ok b{color:var(--green)} .scard.flag b{color:var(--red)} .scard.tbd b{color:var(--muted)}
.zone{margin-bottom:14px}
.zone-h{display:flex;align-items:center;gap:8px;padding:6px 2px;font-weight:700;font-size:15px;color:var(--navy)}
.zone-h .z-count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--card);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);
  border-left:5px solid var(--line);cursor:pointer;transition:transform .05s}
.tile:active{transform:scale(.985)}
.tile.s-ok{border-left-color:var(--green)}
.tile.s-flag{border-left-color:var(--red);background:var(--redbg)}
.tile.s-tbd{border-left-color:var(--blue)}
.tile.s-empty{border-left-color:var(--line);opacity:.65}
.tile .loc{font-weight:600;font-size:14px}
.tile .who{font-size:12.5px;color:var(--muted);margin-top:3px}
.tile .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:7px}
.tag.ok{background:var(--greenbg);color:var(--green)}
.tag.flag{background:#fff;color:var(--red);border:1px solid var(--red)}
.tag.tbd{background:var(--bluebg);color:var(--blue)}
.tag.empty{background:#f1f5f9;color:var(--muted)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-radius:18px 18px 0 0;
  max-width:760px;margin:0 auto;max-height:88vh;overflow:auto;transform:translateY(100%);
  transition:transform .22s ease;padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.sheet.open{transform:translateY(0)}
.sheet-h{position:sticky;top:0;background:#fff;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h .grab{width:38px;height:4px;background:#cbd5e1;border-radius:3px;margin:0 auto 10px}
.sheet-h .loc{font-size:17px;font-weight:700}
.sheet-h .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.sheet-body{padding:8px 16px}
.staffrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.staffrow:last-child{border-bottom:0}
.staffrow .nm{flex:1;font-weight:600;font-size:15px}
.staffrow .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.toggle{display:flex;gap:6px}
.tbtn{border:1.5px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-weight:700;
  font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer;min-width:64px}
.tbtn.present.on{background:var(--green);border-color:var(--green);color:#fff}
.tbtn.absent.on{background:var(--red);border-color:var(--red);color:#fff}
.empty-note{padding:18px 4px;color:var(--muted);text-align:center;font-size:14px}
/* sticky report bar */
.reportbar{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:760px;margin:0 auto;
  padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(0deg,#fff 72%,rgba(255,255,255,0));transform:translateY(120%);
  transition:transform .2s}
.reportbar.show{transform:translateY(0)}
.reportbtn{width:100%;border:0;background:var(--red);color:#fff;font:inherit;font-weight:700;font-size:16px;
  padding:15px;border-radius:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px}
.reportbtn small{font-weight:500;opacity:.9}
.toolrow{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px;gap:8px}
.toolrow .hint{font-size:12px;color:var(--muted)}
.btn-ghost{border:1px solid var(--line);background:#fff;color:var(--navy);font:inherit;font-weight:600;
  font-size:12.5px;padding:7px 11px;border-radius:9px;cursor:pointer}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin:18px 0 4px}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b1220;--card:#0f1b30;--ink:#e7eefb;--line:#22324d;--muted:#93a4be}
  .tile.s-flag{background:#3b1213}
  .sheet,.sheet-h,.reportbar{background:#0f1b30}
  .reportbar{background:linear-gradient(0deg,#0f1b30 72%,rgba(15,27,48,0))}
  .tbtn{background:#0f1b30}
  .tag.flag{background:#0f1b30}
  .tag.empty{background:#16233b}
}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <div class="brand"><span class="dot"></span>SISD Duty Map</div>
    <div class="clock"><div class="t" id="clk-t">--:--</div><div class="d" id="clk-d">—</div></div>
  </div>
  <div class="statusbar">
    <span class="pill" id="status-pill">—</span>
    <span class="pill weekpill" id="week-pill">Week —</span>
    <span class="pill off" id="live-jump" style="cursor:pointer;display:none">Jump to now</span>
  </div>
  <div class="switch" role="tablist" id="switch">
    <button role="tab" data-rel="prev"><span class="lab">Previous</span><span class="val" id="sw-prev">—</span></button>
    <button role="tab" data-rel="now" aria-selected="true"><span class="lab">Now</span><span class="val" id="sw-now">—</span></button>
    <button role="tab" data-rel="next"><span class="lab">Next</span><span class="val" id="sw-next">—</span></button>
  </div>
  <div class="slotline" id="slotline">—</div>
</header>

<main>
  <div class="summary">
    <div class="scard"><b id="sum-total">0</b><span>on duty</span></div>
    <div class="scard ok"><b id="sum-ok">0</b><span>confirmed</span></div>
    <div class="scard flag"><b id="sum-flag">0</b><span>not on duty</span></div>
    <div class="scard tbd"><b id="sum-tbd">0</b><span>to check</span></div>
  </div>
  <div class="toolrow">
    <span class="hint">Tap a location, then mark each staff member.</span>
    <button class="btn-ghost" id="reset-btn">Reset checks</button>
  </div>
  <div id="zones"></div>
  <div class="foot" id="foot">—</div>
</main>

<div class="reportbar" id="reportbar">
  <button class="reportbtn" id="reportbtn">
    <span id="reportbtn-main">Email Jillian — 0 not on duty</span>
  </button>
</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet">
  <div class="sheet-h">
    <div class="grab"></div>
    <div class="loc" id="sheet-loc">Location</div>
    <div class="meta" id="sheet-meta">—</div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

: "First Floor", "icon": "1️⃣", "locations": ["First Floor Atrium", "First Floor Bridge", "First Floor Canteen Grab and Go", "Student Garden First Floor Sports Hall"]}, {"name": "Second Floor", "icon": "2️⃣", "locations": ["Second Floor Atrium", "Second Floor Bridge"]}, {"name": "Third Floor", "icon": "3️⃣", "locations": ["Third Floor Atrium", "Auditorium Third Floor", "Auditorium Third Floor Design", "Common Room 1", "Common Room 2"]}, {"name": "Sports Hall", "icon": "🏀", "locations": ["Sports Hall- Zone A", "Sports Hall- Zone B", "Sports Hall- Zone C", "Sports Hall- Zone D", "Sports Hall Corridor"]}, {"name": "Outdoor & Fields", "icon": "🌳", "locations": ["Courtyard", "Courtyard Food Truck", "Outdoor Green Area Zone A", "Outdoor Green Area Zone B", "Green Astro Pitch by Boarding", "Outdoor Gym / Sports Field", "Sports Field 1", "Sports Field 2", "PY Garden Front", "PY Garden Back"]}], "sessions": [{"key": "Recess", "label": "Break", "start": "09:50", "end": "10:15"}, {"key": "Lunch 1", "label": "Lunch 1", "start": "13:00", "end": "13:20"}, {"key": "Lunch 2", "label": "Lunch 2", "start": "13:20", "end": "13:40"}], "recipientName": "Jillian Caffrey", "recipientEmail": "jillian.caffrey@sisd.ae", "weekAnchor": "2026-04-20", "weekAnchorLetter": "B"};
const $ = s => document.querySelector(s);
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];

/* ---------- time + week engine (ports duty-check logic) ---------- */
function parseHM(s){const[a,b]=s.split(":").map(Number);return a*60+b;}
const SESS = APP.sessions.map((s,i)=>({...s,idx:i,sMin:parseHM(s.start),eMin:parseHM(s.end)}));

function ymd(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function weekLetter(date){
  const a = APP.weekAnchor.split("-").map(Number);
  const anchor = new Date(a[0],a[1]-1,a[2]);
  // Monday of `date`'s week
  const day = (date.getDay()+6)%7; // Mon=0..Sun=6
  const monday = new Date(date.getFullYear(),date.getMonth(),date.getDate()-day);
  const weeks = Math.floor((monday-anchor)/(7*864e5));
  const even = ((weeks%2)+2)%2===0;
  return even ? APP.weekAnchorLetter : (APP.weekAnchorLetter==="B"?"A":"B");
}
function dayName(date){const i=(date.getDay()+6)%7; return i<5?DAYS[i]:null;}

// A "slot" = {week, day, sidx}. Build helpers to step prev/next across weekdays.
function stepSlot(slot, dir){
  let {week,dayI,sidx} = slot;
  sidx += dir;
  if(sidx>=SESS.length){sidx=0; dayI++; if(dayI>4){dayI=0; week=(week==="A"?"B":"A");}}
  if(sidx<0){sidx=SESS.length-1; dayI--; if(dayI<0){dayI=4; week=(week==="A"?"B":"A");}}
  return {week,dayI,sidx};
}
// Resolve the "now" slot from the real clock.
function nowSlot(now){
  const wl = weekLetter(now);
  const dn = dayName(now);
  const mins = now.getHours()*60+now.getMinutes();
  if(dn){
    const di = DAYS.indexOf(dn);
    // inside a window?
    for(const s of SESS){ if(mins>=s.sMin && mins<s.eMin) return {slot:{week:wl,dayI:di,sidx:s.idx},live:true}; }
    // before first / between / after — pick next upcoming today
    for(const s of SESS){ if(mins<s.sMin) return {slot:{week:wl,dayI:di,sidx:s.idx},live:false}; }
    // after last session today -> next weekday first session
    let nx = stepSlot({week:wl,dayI:di,sidx:SESS.length-1},+1);
    return {slot:nx,live:false};
  }
  // weekend -> next Monday first session
  let d2 = new Date(now); while(((d2.getDay()+6)%7)>=5){ d2.setDate(d2.getDate()+1); }
  return {slot:{week:weekLetter(d2),dayI:0,sidx:0},live:false};
}

/* ---------- state ---------- */
let baseSlot=null;     // the "now" anchor slot
let liveNow=false;
let rel="now";         // prev | now | next
let view=null;         // currently displayed slot
const checks = loadChecks(); // key -> "present"|"absent"

function slotKey(s){return s.week+"|"+DAYS[s.dayI]+"|"+SESS[s.sidx].key;}
function checkKey(s,loc,staff){return slotKey(s)+"|"+loc+"|"+staff;}

function loadChecks(){try{return JSON.parse(localStorage.getItem("dutymap.checks")||"{}");}catch(e){return{};}}
function saveChecks(){localStorage.setItem("dutymap.checks",JSON.stringify(checks));}

/* ---------- data lookup ---------- */
function dutiesFor(slot){
  const wk=slot.week, dy=DAYS[slot.dayI], pk=SESS[slot.sidx].key;
  return APP.duties.filter(d=>d.week===wk && d.day===dy && d.period===pk);
}
function staffAt(slot, loc){
  const wk=slot.week, dy=DAYS[slot.dayI], pk=SESS[slot.sidx].key;
  return APP.duties.filter(d=>d.week===wk&&d.day===dy&&d.period===pk&&d.location===loc)
                   .map(d=>d.staff).filter((v,i,a)=>a.indexOf(v)===i).sort();
}

/* ---------- rendering ---------- */
function sessLabel(slot){return SESS[slot.sidx].label;}
function slotHuman(slot){
  const s=SESS[slot.sidx];
  return `${DAYS[slot.dayI]} · Week ${slot.week} · ${s.label} (${s.start}–${s.end})`;
}

function render(){
  // header switcher labels
  const prev=stepSlot(baseSlot,-1), next=stepSlot(baseSlot,+1);
  $("#sw-prev").textContent = SESS[prev.sidx].label;
  $("#sw-now").textContent  = SESS[baseSlot.sidx].label;
  $("#sw-next").textContent = SESS[next.sidx].label;
  document.querySelectorAll(".switch button").forEach(b=>b.setAttribute("aria-selected", b.dataset.rel===rel?"true":"false"));
  view = rel==="prev"?prev: rel==="next"?next: baseSlot;
  $("#slotline").textContent = slotHuman(view);

  // summary
  const rows = dutiesFor(view);
  const locs = new Set(rows.map(r=>r.location));
  let total=rows.length, ok=0, flag=0;
  rows.forEach(r=>{const st=checks[checkKey(view,r.location,r.staff)]; if(st==="present")ok++; else if(st==="absent")flag++;});
  const tbd=total-ok-flag;
  $("#sum-total").textContent=total; $("#sum-ok").textContent=ok;
  $("#sum-flag").textContent=flag; $("#sum-tbd").textContent=tbd;

  // zones
  const wrap=$("#zones"); wrap.innerHTML="";
  APP.zones.forEach(z=>{
    const tiles=[];
    z.locations.forEach(loc=>{
      const staff=staffAt(view,loc);
      if(staff.length===0) return; // hide locations with no one rostered this slot
      let nflag=0,nok=0;
      staff.forEach(s=>{const st=checks[checkKey(view,loc,s)]; if(st==="absent")nflag++; else if(st==="present")nok++;});
      let cls="s-tbd",tag='<span class="tag tbd">To check</span>';
      if(nflag>0){cls="s-flag";tag=`<span class="tag flag">${nflag} not on duty</span>`;}
      else if(nok===staff.length){cls="s-ok";tag='<span class="tag ok">All confirmed</span>';}
      const who = staff.length<=2?staff.join(", "):staff.length+" staff";
      tiles.push(`<div class="tile ${cls}" data-loc="${escA(loc)}">
        <div class="loc">${escH(loc)}</div>
        <div class="who">${escH(who)}</div>${tag}</div>`);
    });
    if(tiles.length===0) return;
    const sec=document.createElement("div"); sec.className="zone";
    sec.innerHTML=`<div class="zone-h">${z.icon} ${escH(z.name)}<span class="z-count">${tiles.length} area${tiles.length>1?'s':''}</span></div>
      <div class="grid">${tiles.join("")}</div>`;
    wrap.appendChild(sec);
  });
  if(!wrap.children.length){
    wrap.innerHTML=`<div class="empty-note">No duties rostered for ${escH(sessLabel(view))} on ${DAYS[view.dayI]} (Week ${view.week}).</div>`;
  }

  // report bar
  const flagged=allFlagged();
  const bar=$("#reportbar");
  if(flagged.length){ bar.classList.add("show"); $("#reportbtn-main").textContent=`Email ${APP.recipientName.split(" ")[0]} — ${flagged.length} not on duty`; }
  else bar.classList.remove("show");

  $("#foot").textContent = `${total} on duty in this window · source: timetable_Non_Class.xlsx`;
  tiles_bind();
}
function tiles_bind(){
  document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>openSheet(t.dataset.loc));
}

/* ---------- detail sheet ---------- */
let sheetLoc=null;
function openSheet(loc){
  sheetLoc=loc;
  const staff=staffAt(view,loc);
  $("#sheet-loc").textContent=loc;
  $("#sheet-meta").textContent=slotHuman(view);
  const body=$("#sheet-body");
  if(staff.length===0){ body.innerHTML=`<div class="empty-note">No one rostered here for this session.</div>`; }
  else body.innerHTML=staff.map(s=>{
    const st=checks[checkKey(view,loc,s)]||"";
    return `<div class="staffrow"><div class="nm">${escH(s)}</div>
      <div class="toggle">
        <button class="tbtn present ${st==='present'?'on':''}" data-st="present" data-s="${escA(s)}">Here</button>
        <button class="tbtn absent ${st==='absent'?'on':''}" data-st="absent" data-s="${escA(s)}">Not here</button>
      </div></div>`;
  }).join("");
  body.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>{
    const s=b.dataset.s, st=b.dataset.st, k=checkKey(view,loc,s);
    if(checks[k]===st) delete checks[k]; else checks[k]=st;
    saveChecks(); openSheet(loc); render();
  });
  $("#sheet-bg").classList.add("open"); $("#sheet").classList.add("open");
}
function closeSheet(){$("#sheet-bg").classList.remove("open");$("#sheet").classList.remove("open");}

/* ---------- flagged + email ---------- */
function allFlagged(){
  // every absent check across all slots (so you can compile a full report)
  const out=[];
  for(const k in checks){ if(checks[k]!=="absent") continue;
    const [wk,day,per,loc,staff]=k.split("|");
    out.push({wk,day,per,loc,staff});
  }
  return out;
}
function slotDate(wk,day){
  // find the NEXT calendar date matching this week-letter + weekday (incl today)
  const di=DAYS.indexOf(day); const today=new Date();
  for(let i=0;i<14;i++){
    const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);
    if(dayName(d)===day && weekLetter(d)===wk) return d;
  }
  return today;
}
function fmtDate(d){return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function sessByKey(k){return SESS.find(s=>s.key===k)||{label:k,start:"",end:""};}
function buildEmail(){
  const f=allFlagged();
  const lines=[]; lines.push(`Dear ${APP.recipientName.split(" ")[0]},`,"",
    "The following staff were not present for their assigned duty during a duty check:","");
  f.sort((a,b)=>(a.day+a.per+a.loc).localeCompare(b.day+b.per+b.loc));
  f.forEach((x,i)=>{
    const s=sessByKey(x.per); const d=slotDate(x.wk,x.day);
    lines.push(`${i+1}. ${x.staff}`);
    lines.push(`   Duty: ${x.loc}`);
    lines.push(`   Session: ${s.label} (${s.start}–${s.end})`);
    lines.push(`   When: ${fmtDate(d)} · Week ${x.wk}`);
    lines.push("");
  });
  lines.push("Recorded via the Duty Map during a live duty check.","",
    "Kind regards,","Craig Mackintosh","Assistant Head Pastoral (Grades 6–9)");
  const subj=`Duty non-attendance — ${f.length} staff flagged (${fmtDate(new Date())})`;
  return {subj, body:lines.join("\n")};
}
function sendReport(){
  const f=allFlagged();
  if(!f.length){alert("Nothing flagged yet. Mark a staff member as “Not here” first.");return;}
  const {subj,body}=buildEmail();
  const url=`mailto:${APP.recipientEmail}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  window.location.href=url;
}

/* ---------- clock + status ---------- */
function tick(){
  const now=new Date();
  $("#clk-t").textContent=now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  $("#clk-d").textContent=now.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
  const dn=dayName(now); const mins=now.getHours()*60+now.getMinutes();
  const pill=$("#status-pill"); pill.className="pill";
  let inWin=null; if(dn){for(const s of SESS){if(mins>=s.sMin&&mins<s.eMin){inWin=s;break;}}}
  if(inWin){pill.classList.add("live");pill.textContent="● LIVE · "+inWin.label;}
  else{
    let up=null; if(dn){for(const s of SESS){if(mins<s.sMin){up=s;break;}}}
    if(up){pill.classList.add("soon");pill.textContent="Next: "+up.label+" "+up.start;}
    else{pill.classList.add("off");pill.textContent=dn?"No more duties today":"No duties (weekend)";}
  }
  $("#week-pill").textContent="Week "+weekLetter(now);
}

/* ---------- helpers ---------- */
function escH(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escA(s){return String(s).replace(/"/g,"&quot;");}

/* ---------- init ---------- */
function setBaseToNow(){
  const r=nowSlot(new Date()); baseSlot=r.slot; liveNow=r.live; rel="now";
}
function init(){
  setBaseToNow();
  tick(); setInterval(tick,15000);
  render();
  document.querySelectorAll(".switch button").forEach(b=>b.onclick=()=>{rel=b.dataset.rel;render();});
  $("#sheet-bg").onclick=closeSheet;
  $("#reportbtn").onclick=sendReport;
  $("#reset-btn").onclick=()=>{
    if(!confirm("Clear all present / not-here marks for every session?"))return;
    for(const k in checks) delete checks[k]; saveChecks(); render();
  };
  $("#live-jump").onclick=()=>{setBaseToNow();render();};
  // re-anchor to real "now" every minute so the Now tab stays current
  setInterval(()=>{ if(rel==="now"){const old=slotKey(baseSlot);setBaseToNow();if(slotKey(baseSlot)!==old)render();} },60000);
}
document.addEventListener("DOMContentLoaded",init);
