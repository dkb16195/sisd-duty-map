<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duty Map">
<meta name="theme-color" content="#0b2545">
<meta name="robots" content="noindex, nofollow">
<title>SISD Duty Map</title>
<style>
:root{
  --navy:#0b2545; --navy2:#13315c; --ink:#0f172a; --line:#e2e8f0;
  --bg:#f1f5f9; --card:#ffffff; --muted:#64748b;
  --green:#16a34a; --greenbg:#dcfce7; --red:#dc2626; --redbg:#fee2e2;
  --amber:#d97706; --amberbg:#fef3c7; --blue:#2563eb; --bluebg:#dbeafe;
  --purple:#7c3aed; --purplebg:#ede9fe;
  --shadow:0 1px 3px rgba(15,23,42,.10),0 1px 2px rgba(15,23,42,.06);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;box-shadow:var(--shadow)}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:#38bdf8;box-shadow:0 0 8px #38bdf8}
.brand small{font-weight:500;font-size:11px;opacity:.75;margin-left:2px}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock .t{font-size:18px;font-weight:700}
.clock .d{font-size:11px;opacity:.8}
.statusbar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff}
.pill.live{background:#16a34a}
.pill.soon{background:#d97706}
.pill.off{background:rgba(255,255,255,.16)}
.pill.test{background:#7c3aed}
.weekpill{background:rgba(255,255,255,.16)}
/* Prev / Now / Next switcher */
.switch{display:flex;gap:6px;margin-top:10px;background:rgba(255,255,255,.10);padding:4px;border-radius:12px}
.switch button{flex:1;border:0;background:transparent;color:#cbd5e1;font:inherit;font-weight:600;
  font-size:13px;padding:8px 6px;border-radius:9px;cursor:pointer;line-height:1.2}
.switch button .lab{display:block;font-size:11px;opacity:.75;font-weight:600}
.switch button .val{display:block;font-size:13px;font-weight:700;color:#fff}
.switch button[aria-selected="true"]{background:#fff}
.switch button[aria-selected="true"] .lab{color:var(--navy);opacity:.7}
.switch button[aria-selected="true"] .val{color:var(--navy)}
.slotline{margin-top:8px;font-size:12.5px;color:#dbeafe;text-align:center;font-weight:500}
.checkline{margin-top:4px;font-size:12px;color:#fff;text-align:center;font-weight:600}
.checkline .who{background:rgba(255,255,255,.18);padding:2px 9px;border-radius:999px;margin-left:4px}
main{max-width:760px;margin:0 auto;padding:12px 12px 120px}
.summary{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.scard{flex:1;min-width:80px;background:var(--card);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);text-align:center}
.scard b{display:block;font-size:20px;line-height:1.1}
.scard span{font-size:11px;color:var(--muted)}
.scard.ok b{color:var(--green)} .scard.flag b{color:var(--red)} .scard.tbd b{color:var(--muted)}
.banner{background:var(--purplebg);color:#4c1d95;border-radius:12px;padding:9px 12px;font-size:12.5px;margin:0 0 12px;box-shadow:var(--shadow)}
.zone{margin-bottom:14px}
.zone-h{display:flex;align-items:center;gap:8px;padding:6px 2px;font-weight:700;font-size:15px;color:var(--navy)}
.zone-h .z-count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;align-items:start}
.tile{background:var(--card);border-radius:12px;padding:9px 10px;box-shadow:var(--shadow);
  border-left:4px solid var(--line)}
.tile.s-ok{border-left-color:var(--green)}
.tile.s-flag{border-left-color:var(--red);background:var(--redbg)}
.tile.s-tbd{border-left-color:var(--blue)}
.tile.s-empty{border-left-color:var(--amber);background:#fffbeb}
.tile .loc{font-weight:700;font-size:12.5px;line-height:1.15;color:var(--navy)}
.stafflist{display:flex;flex-direction:column;gap:5px;margin:7px 0 2px}
.sname{display:flex;align-items:center;gap:6px;width:100%;
  border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;
  font-size:13.5px;padding:6px 8px;border-radius:8px;cursor:pointer;text-align:left;line-height:1.2;
  transition:transform .04s}
.sname:active{transform:scale(.97)}
.sname .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.sname .st{flex:none;width:14px;text-align:center;font-size:13px;font-weight:900;color:transparent}
.sname.present{background:var(--greenbg);border-color:var(--green);color:#065f46}
.sname.present .st{color:var(--green)}
.sname.absent{background:var(--redbg);border-color:var(--red);color:#b91c1c}
.sname.absent .st{color:var(--red)}
.sname.slt{border-style:dashed}
.av{flex:none;width:30px;height:30px;border-radius:50%;object-fit:cover;background:#e5e7eb;
  border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line)}
.av.ini{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
  color:#fff;background:var(--navy);letter-spacing:.3px}
.sname.present .av{box-shadow:0 0 0 2px var(--green)}
.sname.absent .av{box-shadow:0 0 0 2px var(--red)}
#checkline .av{width:22px;height:22px;vertical-align:middle;margin:0 4px 0 2px}
.unfilled{font-size:12.5px;color:#92400e;font-weight:600;padding:6px 2px}
.tile .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-top:5px}
.tag.ok{background:var(--greenbg);color:var(--green)}
.tag.flag{background:#fff;color:var(--red);border:1px solid var(--red)}
.tag.tbd{background:var(--bluebg);color:var(--blue)}
.tag.empty{background:var(--amberbg);color:#92400e}
.tag.slt{background:var(--purplebg);color:var(--purple);margin-left:4px}
.empty-note{padding:18px 4px;color:var(--muted);text-align:center;font-size:14px}
/* sticky report bar */
.reportbar{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:760px;margin:0 auto;
  padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(0deg,#fff 72%,rgba(255,255,255,0));transform:translateY(120%);
  transition:transform .2s}
.reportbar.show{transform:translateY(0)}
.reportbtn{width:100%;border:0;background:var(--red);color:#fff;font:inherit;font-weight:700;font-size:16px;
  padding:15px;border-radius:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px}
.reportbtn small{font-weight:500;opacity:.9}
.toolrow{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px;gap:8px}
.toolrow .hint{font-size:12px;color:var(--muted)}
.btn-ghost{border:1px solid var(--line);background:#fff;color:var(--navy);font:inherit;font-weight:600;
  font-size:12.5px;padding:7px 11px;border-radius:9px;cursor:pointer}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin:18px 0 4px;line-height:1.5}
/* ---------- week overview ---------- */
.wk-open-btn{border:0;font:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-left:auto;
  background:#fff;color:var(--navy);padding:5px 11px;border-radius:999px}
#weekview{display:none}
body.wk-on > header, body.wk-on > main, body.wk-on > .reportbar{display:none}
body.wk-on #weekview{display:block}
.wk-head{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;box-shadow:var(--shadow)}
.wk-top{display:flex;align-items:center;gap:10px}
.wk-back{border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-weight:700;font-size:13px;
  padding:7px 12px;border-radius:999px;cursor:pointer}
.wk-title{font-weight:700;font-size:17px}
.wk-nav{display:flex;align-items:center;gap:8px;margin-top:10px}
.wk-nav button{border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-weight:800;font-size:18px;
  width:40px;height:40px;border-radius:10px;cursor:pointer;flex:none}
.wk-label{flex:1;text-align:center;line-height:1.25}
.wk-label b{display:block;font-size:15px}
.wk-label span{font-size:12px;color:#dbeafe}
.wk-quick{display:flex;gap:6px;margin-top:10px;background:rgba(255,255,255,.10);padding:4px;border-radius:12px}
.wk-quick button{flex:1;border:0;background:transparent;color:#fff;font:inherit;font-weight:700;font-size:13px;
  padding:8px 6px;border-radius:9px;cursor:pointer}
.wk-quick button[aria-selected="true"]{background:#fff;color:var(--navy)}
#weekview main.wk-main{max-width:760px;margin:0 auto;padding:12px 12px 40px;display:block}
.wk-me{display:flex;flex-direction:column;gap:5px;background:var(--card);border-radius:12px;padding:10px 12px;
  box-shadow:var(--shadow);font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:12px}
.wk-me select{font:inherit;font-size:15px;font-weight:600;color:var(--ink);padding:9px 10px;border-radius:9px;
  border:1.5px solid var(--line);background:#fff;width:100%}
.mine{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px;margin-bottom:14px;
  border-left:4px solid var(--blue)}
.mine-h{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:15px;margin-bottom:8px}
.mine-h .av{width:38px;height:38px}
.mine-h small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.mine-day{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 4px}
.mine-row{display:flex;gap:10px;align-items:baseline;padding:7px 9px;border-radius:9px;background:var(--bg);margin-bottom:5px;font-size:14px}
.mine-row .t{flex:none;width:118px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.mine-row .t small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.mine-row .w{flex:1;font-weight:600}
.mine-none{color:var(--muted);font-size:14px;padding:6px 2px}
.wk-h{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:6px 2px 8px}
.wday{background:var(--card);border-radius:12px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.wday summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy)}
.wday summary::-webkit-details-marker{display:none}
.wday summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .15s}
.wday[open] summary::after{transform:rotate(180deg)}
.wday summary .tdy{font-size:10.5px;font-weight:800;background:var(--bluebg);color:var(--blue);padding:2px 7px;border-radius:999px}
.wday summary .cnt{font-size:12px;color:var(--muted);font-weight:600}
.wsess{padding:2px 14px 10px}
.wsh{font-size:12.5px;font-weight:800;color:var(--navy);padding:8px 0 5px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.wsh span{font-weight:600;color:var(--muted);font-size:12px}
.wsh .ck{margin-left:auto;font-weight:600;color:var(--purple);font-size:11.5px;text-align:right}
.wrow{display:flex;gap:10px;padding:4px 0;font-size:13px;border-bottom:1px dashed #eef2f7}
.wrow:last-child{border-bottom:0}
.wrow .l{flex:0 0 44%;color:var(--muted);font-weight:600}
.wrow .n{flex:1;font-weight:600;display:flex;flex-direction:column;gap:3px}
.wrow .n span{display:flex;align-items:center;gap:6px}
.wrow .av{width:20px;height:20px;font-size:8.5px;border-width:1px}
.wrow.me{background:#fef9c3;border-radius:6px;margin:0 -6px;padding:4px 6px}
.wsh .ck.me{background:#fef9c3;border-radius:6px;padding:1px 6px}
.wrow .un{color:#92400e}
.wk-empty{background:var(--card);border-radius:12px;padding:20px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
@media print{
  body.wk-on .wk-head{position:static;background:none;color:var(--ink);box-shadow:none}
  .wk-back,.wk-nav button,.wk-quick,.wk-me{display:none}
  .wday{box-shadow:none;border:1px solid var(--line);break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <div class="brand"><span class="dot"></span>SISD Duty Map <small>2026-27</small></div>
    <div class="clock"><div class="t" id="clk-t">--:--</div><div class="d" id="clk-d">&mdash;</div></div>
  </div>
  <div class="statusbar">
    <span class="pill" id="status-pill">&mdash;</span>
    <span class="pill weekpill" id="week-pill">Week &mdash;</span>
    <span class="pill test" id="test-pill" style="display:none">TEST TIME</span>
    <span class="pill off" id="live-jump" style="cursor:pointer;display:none">Jump to now</span>
    <button class="wk-open-btn" id="wk-open" type="button">&#128197; Week overview</button>
  </div>
  <div class="switch" role="tablist" id="switch">
    <button role="tab" data-rel="prev"><span class="lab">Previous</span><span class="val" id="sw-prev">&mdash;</span></button>
    <button role="tab" data-rel="now" aria-selected="true"><span class="lab">Now</span><span class="val" id="sw-now">&mdash;</span></button>
    <button role="tab" data-rel="next"><span class="lab">Next</span><span class="val" id="sw-next">&mdash;</span></button>
  </div>
  <div class="slotline" id="slotline">&mdash;</div>
  <div class="checkline" id="checkline"></div>
</header>

<main>
  <div class="summary">
    <div class="scard"><b id="sum-total">0</b><span>on duty</span></div>
    <div class="scard ok"><b id="sum-ok">0</b><span>confirmed</span></div>
    <div class="scard flag"><b id="sum-flag">0</b><span>not on duty</span></div>
    <div class="scard tbd"><b id="sum-tbd">0</b><span>to check</span></div>
  </div>
  <div class="banner" id="banner" style="display:none"></div>
  <div class="toolrow">
    <span class="hint">Tap a name: once = on duty, twice = off duty, again to clear.</span>
    <button class="btn-ghost" id="reset-btn">Reset checks</button>
  </div>
  <div id="zones"></div>
  <div class="foot" id="foot">&mdash;</div>
</main>

<div class="reportbar" id="reportbar">
  <button class="reportbtn" id="reportbtn">
    <span id="reportbtn-main">Email Jillian &mdash; 0 not on duty</span>
  </button>
</div>

<section id="weekview" aria-label="Week overview">
  <div class="wk-head">
    <div class="wk-top">
      <button class="wk-back" id="wk-back" type="button">&lsaquo; Live check</button>
      <div class="wk-title">Week overview</div>
    </div>
    <div class="wk-nav">
      <button id="wk-prev" type="button" aria-label="Previous week">&lsaquo;</button>
      <div class="wk-label" id="wk-label">&mdash;</div>
      <button id="wk-next" type="button" aria-label="Next week">&rsaquo;</button>
    </div>
    <div class="wk-quick" id="wk-quick">
      <button type="button" data-q="this">This week</button>
      <button type="button" data-q="next">Next week</button>
    </div>
  </div>
  <main class="wk-main">
    <label class="wk-me">Show duties for
      <select id="wk-me"></select>
    </label>
    <div id="wk-mine"></div>
    <div class="wk-h" id="wk-allh">Whole rota &middot; tap a day to open</div>
    <div id="wk-days"></div>
    <div class="foot" id="wk-foot"></div>
  </main>
</section>

<script>

/* ---------- time + week engine ---------- */
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseHM(s){const[a,b]=s.split(":").map(Number);return a*60+b;}
function mkSess(list){return list.map((s,i)=>({...s,idx:i,sMin:parseHM(s.start),eMin:parseHM(s.end)}));}
const SESS_MT = mkSess(APP.sessionsMonThu);
const SESS_FRI = mkSess(APP.sessionsFriday);
function wdIndex(d){return (d.getDay()+6)%7;}            // Mon=0 .. Sun=6
function mondayOf(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()-wdIndex(d));}
function parseISO(s){const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);}
function weekLetter(d){
  const m = iso(mondayOf(d));
  if(APP.weekCalendar[m]) return APP.weekCalendar[m];
  const w1 = parseISO(APP.week1Monday);
  const weeks = Math.round((mondayOf(d)-w1)/(7*864e5));
  return ((weeks%2)+2)%2===0 ? "A" : "B";
}
function isSchoolWeek(d){return !!APP.weekCalendar[iso(mondayOf(d))];}
function isSchoolDay(d){return wdIndex(d)<5 && isSchoolWeek(d);}
function sessionsFor(d){return wdIndex(d)===4 ? SESS_FRI : SESS_MT;}
function dayName(d){const i=wdIndex(d);return i<5?DAYS[i]:null;}
function nextSchoolDay(d,dir){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  for(let i=0;i<120;i++){ x.setDate(x.getDate()+dir); if(isSchoolDay(x)) return x; }
  return x;
}

// A "slot" = {date, sidx}. Step prev/next across sessions and school days.
function stepSlot(slot, dir){
  let d=new Date(slot.date), sidx=slot.sidx+dir;
  const sess=sessionsFor(d);
  if(sidx>=sess.length){ d=nextSchoolDay(d,+1); sidx=0; }
  else if(sidx<0){ d=nextSchoolDay(d,-1); sidx=sessionsFor(d).length-1; }
  return {date:d, sidx};
}
// Resolve the "now" slot from the clock.
function nowSlot(now){
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const mins=now.getHours()*60+now.getMinutes();
  if(isSchoolDay(today)){
    const sess=sessionsFor(today);
    for(const s of sess){ if(mins>=s.sMin && mins<s.eMin) return {slot:{date:today,sidx:s.idx},live:true}; }
    for(const s of sess){ if(mins<s.sMin) return {slot:{date:today,sidx:s.idx},live:false}; }
  }
  return {slot:{date:nextSchoolDay(today,+1),sidx:0},live:false};
}

/* ---------- state ---------- */
let baseSlot=null;     // the "now" anchor slot
let liveNow=false;
let rel="now";         // prev | now | next
let view=null;         // currently displayed slot
const checks = loadChecks(); // key -> "present"|"absent"

function sessOf(slot){return sessionsFor(slot.date)[slot.sidx];}
function slotKey(s){return iso(s.date)+"|"+sessOf(s).key;}
function checkKey(s,loc,staff){return slotKey(s)+"|"+loc+"|"+staff;}

function loadChecks(){
  // Every visit starts clean — never pre-fill flags from a previous check.
  try{localStorage.removeItem("dutymap.checks");}catch(e){}
  return {};
}
function saveChecks(){/* intentionally not persisted — each visit is a fresh slate */}

/* ---------- data lookup ---------- */
function resolveStaff(d, slot){
  // Monday-morning "Rota" slot -> named person from the Monday Morning Atrium rota
  if(d.rota){ return APP.mondayRota[iso(slot.date)] || ""; }
  return d.staff;
}
function dutiesFor(slot){
  const wk=weekLetter(slot.date), dy=dayName(slot.date), pk=sessOf(slot).key;
  const today=iso(slot.date);
  return APP.duties.filter(d=>d.week===wk && d.day===dy && d.period===pk
                              && (!d.from || today>=d.from) && (!d.until || today<=d.until))
                   .map(d=>({...d, staff:resolveStaff(d,slot)}));
}
function checkerFor(slot){
  const s=sessOf(slot); if(!s.checker) return null;
  const day=dayName(slot.date); const c=(APP.checkers[day]||{})[s.checker];
  return c ? {name:c, session:s.checker} : null;
}

/* ---------- staff photos ---------- */
const TITLE_WORDS=new Set(["mr","ms","mrs","miss","dr","mx","mme","sir"]);
function initials(s){
  const w=String(s).replace(/[^A-Za-z' -]/g," ").split(/\s+/).filter(Boolean);
  const parts=w.filter((x,i)=>!(i===0&&TITLE_WORDS.has(x.toLowerCase())));
  const use=parts.length?parts:w;
  return ((use[0]||"?")[0]+(use.length>1?use[use.length-1][0]:"")).toUpperCase();
}
function avatar(s){
  const src=(APP.photos||{})[s];
  return src ? `<img class="av" src="${src}" alt="" loading="lazy">`
             : `<span class="av ini" aria-hidden="true">${escH(initials(s))}</span>`;
}

/* ---------- rendering ---------- */
function slotHuman(slot){
  const s=sessOf(slot);
  const d=slot.date.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
  return `${d} · Week ${weekLetter(slot.date)} · ${s.label} (${s.start}–${s.end})`;
}

function render(){
  const prev=stepSlot(baseSlot,-1), next=stepSlot(baseSlot,+1);
  $("#sw-prev").textContent = sessOf(prev).label;
  $("#sw-now").textContent  = sessOf(baseSlot).label;
  $("#sw-next").textContent = sessOf(next).label;
  document.querySelectorAll(".switch button").forEach(b=>b.setAttribute("aria-selected", b.dataset.rel===rel?"true":"false"));
  view = rel==="prev"?prev: rel==="next"?next: baseSlot;
  $("#slotline").textContent = slotHuman(view);

  // duty checker line
  const ck=checkerFor(view);
  const cl=$("#checkline");
  if(ck){ cl.innerHTML = `Duty check (${escH(ck.session)}): ${avatar(ck.name)}<span class="who">${escH(ck.name)}</span>`; cl.style.display=""; }
  else { cl.innerHTML=""; cl.style.display="none"; }

  // summary
  const rows = dutiesFor(view);
  const named = rows.filter(r=>r.staff);
  let total=named.length, ok=0, flag=0;
  named.forEach(r=>{const st=checks[checkKey(view,r.location,r.staff)]; if(st==="present")ok++; else if(st==="absent")flag++;});
  const tbd=total-ok-flag;
  $("#sum-total").textContent=total; $("#sum-ok").textContent=ok;
  $("#sum-flag").textContent=flag; $("#sum-tbd").textContent=tbd;

  // banner for SLT-only windows
  const sess=sessOf(view);
  const banner=$("#banner");
  if(sess.kind==="slt"){
    banner.style.display="";
    banner.textContent = sess.key==="Morning" ? "SLT morning duty — gates, atrium and doors (from the SLT duty rota)."
                       : sess.key==="Afternoon" ? "SLT afternoon duty — courtyard and gates at home time (from the SLT duty rota)."
                       : "SLT evening sweep after ASAs (from the SLT duty rota).";
  } else banner.style.display="none";

  // zones
  const wrap=$("#zones"); wrap.innerHTML="";
  const byLoc={};
  rows.forEach(r=>{(byLoc[r.location]=byLoc[r.location]||[]).push(r);});
  APP.zones.forEach(z=>{
    const tiles=[];
    z.locations.forEach(loc=>{
      const here=byLoc[loc]; if(!here) return;
      const staff=[...new Set(here.map(r=>r.staff).filter(Boolean))].sort();
      const isSlt=here.some(r=>r.src==="slt");
      let nflag=0,nok=0;
      staff.forEach(s=>{const st=checks[checkKey(view,loc,s)]; if(st==="absent")nflag++; else if(st==="present")nok++;});
      let cls="s-tbd",tag='<span class="tag tbd">To check</span>';
      if(staff.length===0){cls="s-empty";tag='<span class="tag empty">Unfilled — no one rostered</span>';}
      else if(nflag>0){cls="s-flag";tag=`<span class="tag flag">${nflag} not on duty</span>`;}
      else if(nok===staff.length){cls="s-ok";tag='<span class="tag ok">All confirmed</span>';}
      if(isSlt) tag+='<span class="tag slt">SLT</span>';
      const list=staff.length ? staff.map(s=>{
        const st=checks[checkKey(view,loc,s)]||"";
        const c=st==="present"?"present":st==="absent"?"absent":"";
        const badge=st==="present"?"✓":st==="absent"?"✗":"";
        return `<button class="sname ${c}${isSlt?' slt':''}" data-loc="${escA(loc)}" data-s="${escA(s)}">`
          +`${avatar(s)}<span class="nm">${escH(s)}</span><span class="st">${badge}</span></button>`;
      }).join("") : `<div class="unfilled">${here.some(r=>r.rota)?"Not on the Monday rota for this date":"Slot needs filling"}</div>`;
      tiles.push(`<div class="tile ${cls}">
        <div class="loc">${escH(loc)}</div>
        <div class="stafflist">${list}</div>${tag}</div>`);
    });
    if(tiles.length===0) return;
    const sec=document.createElement("div"); sec.className="zone";
    sec.innerHTML=`<div class="zone-h">${z.icon} ${escH(z.name)}<span class="z-count">${tiles.length} area${tiles.length>1?'s':''}</span></div>
      <div class="grid">${tiles.join("")}</div>`;
    wrap.appendChild(sec);
  });
  if(!wrap.children.length){
    wrap.innerHTML=`<div class="empty-note">No duties rostered for ${escH(sess.label)} on ${escH(dayName(view.date))} (Week ${weekLetter(view.date)}).</div>`;
  }

  // report bar
  const flagged=allFlagged();
  const bar=$("#reportbar");
  if(flagged.length){ bar.classList.add("show"); $("#reportbtn-main").textContent=`Email ${APP.recipientName.split(" ")[0]} — ${flagged.length} not on duty`; }
  else bar.classList.remove("show");

  const unf=rows.length-named.length;
  $("#foot").innerHTML = `${total} on duty in this window${unf?` · ${unf} unfilled slot${unf>1?'s':''}`:''}<br>`
    + `Sources: ${APP.sources.map(escH).join(" · ")}<br>Built ${escH(APP.built)}`;
  tiles_bind();
}
// Tap a name to cycle: unchecked -> on duty -> off duty -> unchecked.
const CYCLE={"":"present","present":"absent","absent":""};
function tiles_bind(){
  document.querySelectorAll(".sname").forEach(b=>b.onclick=()=>{
    const k=checkKey(view,b.dataset.loc,b.dataset.s);
    const nx=CYCLE[checks[k]||""];
    if(nx) checks[k]=nx; else delete checks[k];
    saveChecks(); render();
  });
}

/* ---------- flagged + email ---------- */
function allFlagged(){
  const out=[];
  for(const k in checks){ if(checks[k]!=="absent") continue;
    const [date,per,loc,staff]=k.split("|");
    out.push({date,per,loc,staff});
  }
  return out;
}
function fmtDate(d){return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function sessByKey(d,k){return sessionsFor(d).find(s=>s.key===k)||{label:k,start:"",end:""};}
function buildEmail(){
  const f=allFlagged();
  const lines=[]; lines.push(`Dear ${APP.recipientName.split(" ")[0]},`,"",
    "The following staff were not present for their assigned duty during a duty check:","");
  f.sort((a,b)=>(a.date+a.per+a.loc).localeCompare(b.date+b.per+b.loc));
  f.forEach((x,i)=>{
    const d=parseISO(x.date); const s=sessByKey(d,x.per);
    lines.push(`${i+1}. ${x.staff}`);
    lines.push(`   Duty: ${x.loc}`);
    lines.push(`   Session: ${s.label} (${s.start}–${s.end})`);
    lines.push(`   When: ${fmtDate(d)} · Week ${weekLetter(d)}`);
    lines.push("");
  });
  lines.push("Recorded via the Duty Map during a live duty check.","",
    "Kind regards,","Craig Mackintosh","Assistant Head Pastoral (Grades 6–9)");
  const subj=`Duty non-attendance — ${f.length} staff flagged (${fmtDate(nowDate())})`;
  return {subj, body:lines.join("\n")};
}
function sendReport(){
  const f=allFlagged();
  if(!f.length){alert("Nothing flagged yet. Mark a staff member as “Not here” first.");return;}
  const {subj,body}=buildEmail();
  const url=`mailto:${APP.recipientEmail}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  window.location.href=url;
}

/* ---------- clock + status ---------- */
function tick(){
  const now=nowDate();
  $("#clk-t").textContent=now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  $("#clk-d").textContent=now.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const mins=now.getHours()*60+now.getMinutes();
  const pill=$("#status-pill"); pill.className="pill";
  let inWin=null, up=null;
  if(isSchoolDay(today)){
    for(const s of sessionsFor(today)){ if(mins>=s.sMin&&mins<s.eMin){inWin=s;break;} }
    if(!inWin){ for(const s of sessionsFor(today)){ if(mins<s.sMin){up=s;break;} } }
  }
  if(inWin){pill.classList.add("live");pill.textContent="● LIVE · "+inWin.label;}
  else if(up){pill.classList.add("soon");pill.textContent="Next: "+up.label+" "+up.start;}
  else{pill.classList.add("off");pill.textContent=isSchoolDay(today)?"No more duties today":(wdIndex(today)>=5?"No duties (weekend)":"No duties (holiday)");}
  $("#week-pill").textContent="Week "+weekLetter(today)+(isSchoolWeek(today)?"":" (not a school week)");
  $("#test-pill").style.display = TEST_AT ? "" : "none";
}

/* ---------- helpers ---------- */
function escH(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escA(s){return String(s).replace(/"/g,"&quot;");}

/* ---------- week overview (separate screen: #week) ---------- */
const SCHOOL_MONDAYS = Object.keys(APP.weekCalendar).sort();
const LOC_ORDER = (()=>{const o={};let i=0;APP.zones.forEach(z=>z.locations.forEach(l=>{if(!(l in o))o[l]=i++;}));return o;})();
let wkMonday = null;
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function currentWeekMonday(){
  const t=nowDate(); const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  let m=mondayOf(today); if(wdIndex(today)>=5) m=addDays(m,7);
  const k=iso(m); if(APP.weekCalendar[k]) return m;
  const nx=SCHOOL_MONDAYS.find(x=>x>k); return nx?parseISO(nx):m;
}
function stepWeek(dir){
  const k=iso(wkMonday);
  const list=dir>0?SCHOOL_MONDAYS.filter(x=>x>k):SCHOOL_MONDAYS.filter(x=>x<k).reverse();
  if(list.length) wkMonday=parseISO(list[0]);
}
function surnameKey(n){
  const w=String(n).split(/\s+/).filter((x,i)=>!(i===0&&TITLE_WORDS.has(x.toLowerCase())));
  return ((w[w.length-1]||"")+" "+w.join(" ")).toLowerCase();
}
function allStaffNames(){
  const s=new Set();
  APP.duties.forEach(d=>{if(d.staff)s.add(CANON(d.staff));});
  Object.values(APP.mondayRota||{}).forEach(n=>n&&s.add(CANON(n)));
  Object.values(APP.checkers||{}).forEach(o=>Object.values(o).forEach(n=>n&&s.add(CANON(n))));
  return [...s].sort((a,b)=>surnameKey(a).localeCompare(surnameKey(b)));
}
function getMe(){try{return localStorage.getItem("dutymap.me")||"";}catch(e){return "";}}
function setMe(v){try{v?localStorage.setItem("dutymap.me",v):localStorage.removeItem("dutymap.me");}catch(e){}}
function dayPlan(d){
  if(!isSchoolDay(d)) return [];
  return sessionsFor(d).map((s,i)=>{
    const slot={date:d,sidx:i};
    const rows=dutiesFor(slot).sort((a,b)=>((LOC_ORDER[a.location]??999)-(LOC_ORDER[b.location]??999))||a.location.localeCompare(b.location));
    return {sess:s, rows, checker:checkerFor(slot)};
  });
}
function smallAv(n){return avatar(n);}
const CANON=n=>(APP.fullNames||{})[n]||n;
function avatarFor(person){
  const alias=Object.keys(APP.photos||{}).find(k=>CANON(k)===person);
  return avatar(alias||person);
}
function renderWeek(){
  const sel=$("#wk-me");
  if(!sel.options.length){
    sel.innerHTML='<option value="">Everyone (whole rota)</option>'+allStaffNames().map(n=>`<option value="${escA(n)}">${escH(n)}</option>`).join("");
    sel.value=getMe(); if(sel.value!==getMe()) sel.value="";
  }
  const me=sel.value;
  const days=[0,1,2,3,4].map(i=>addDays(wkMonday,i));
  const school=!!APP.weekCalendar[iso(wkMonday)];
  const fri=days[4];
  const fmt=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  $("#wk-label").innerHTML=`<b>${school?"Week "+weekLetter(wkMonday):"No school"}</b><span>Mon ${fmt(wkMonday)} – Fri ${fmt(fri)}</span>`;
  const cur=iso(currentWeekMonday()), nxt=SCHOOL_MONDAYS.find(x=>x>cur);
  document.querySelectorAll("#wk-quick button").forEach(b=>{
    const tgt=b.dataset.q==="this"?cur:nxt;
    b.setAttribute("aria-selected", iso(wkMonday)===tgt?"true":"false");
    const letter=tgt&&APP.weekCalendar[tgt]; b.textContent=(b.dataset.q==="this"?"This week":"Next week")+(letter?` (Week ${letter})`:"");
  });
  $("#wk-prev").disabled=!SCHOOL_MONDAYS.some(x=>x<iso(wkMonday));
  $("#wk-next").disabled=!SCHOOL_MONDAYS.some(x=>x>iso(wkMonday));

  const plans=days.map(d=>({d, plan:dayPlan(d)}));
  // ---- my duties ----
  const mine=$("#wk-mine");
  if(me){
    let html="", n=0;
    plans.forEach(({d,plan})=>{
      const items=[];
      plan.forEach(({sess,rows,checker})=>{
        const locs=[...new Set(rows.filter(r=>r.staff&&CANON(r.staff)===me).map(r=>r.location))];
        locs.forEach(l=>items.push({label:sess.label,start:sess.start,end:sess.end,what:escH(l)}));
        if(checker&&CANON(checker.name)===me) items.push({label:sess.label,start:sess.start,end:sess.end,what:`Duty checker (${escH(checker.session)})`});
      });
      // Lunch 1 + Lunch 2 at the same post = one lunch duty
      for(let i=items.length-1;i>0;i--){
        const a=items.find((x,j)=>j<i&&x.what===items[i].what&&x.end===items[i].start);
        if(a){ a.end=items[i].end; a.label=a.label.replace(/\s*\d+$/,""); items.splice(i,1); }
      }
      if(!items.length) return;
      n+=items.length;
      html+=`<div class="mine-day">${escH(d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"}))}</div>`
        + items.map(it=>`<div class="mine-row"><span class="t">${escH(it.label)}<small>${it.start}–${it.end}</small></span><span class="w">${it.what}</span></div>`).join("");
    });
    mine.innerHTML=`<div class="mine"><div class="mine-h">${avatarFor(me)}<div>${escH(me)}<small>${n?`${n} dut${n>1?"ies":"y"} this week`:"No duties this week"}</small></div></div>`
      + (n?html:`<div class="mine-none">${school?"Nothing on the rota for this week.":"No school this week."}</div>`)+`</div>`;
  } else mine.innerHTML="";

  // ---- whole rota by day ----
  const wrap=$("#wk-days");
  if(!school){ wrap.innerHTML=`<div class="wk-empty">No duties — this is a holiday week.</div>`; $("#wk-allh").style.display="none"; }
  else{
    $("#wk-allh").style.display="";
    const todayIso=iso(nowDate());
    wrap.innerHTML=plans.map(({d,plan})=>{
      const isToday=iso(d)===todayIso;
      if(!plan.length) return `<details class="wday"><summary>${escH(d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"}))}<span class="cnt">No duties</span></summary></details>`;
      const total=plan.reduce((a,p)=>a+p.rows.filter(r=>r.staff).length,0);
      const sessHtml=plan.map(({sess,rows,checker})=>{
        if(!rows.length && !checker) return "";
        const byLoc=[]; const idx={};
        rows.forEach(r=>{ if(!(r.location in idx)){idx[r.location]=byLoc.length;byLoc.push({loc:r.location,names:[],rota:false});}
          const g=byLoc[idx[r.location]]; if(r.staff&&!g.names.includes(r.staff)) g.names.push(r.staff); if(r.rota) g.rota=true; });
        const rowsHtml=byLoc.map(g=>{
          const isMe=me&&g.names.some(n=>CANON(n)===me);
          const who=g.names.length?g.names.map(n=>`<span>${smallAv(n)}${escH(n)}</span>`).join("")
                   :`<span class="un">${g.rota?"Not on the Monday rota":"Unfilled"}</span>`;
          return `<div class="wrow${isMe?" me":""}"><span class="l">${escH(g.loc)}</span><span class="n">${who}</span></div>`;
        }).join("");
        const ck=checker?`<span class="ck${me&&CANON(checker.name)===me?" me":""}">Checker: ${escH(checker.name)}</span>`:"";
        return `<div class="wsess"><div class="wsh">${escH(sess.label)} <span>${sess.start}–${sess.end}</span>${ck}</div>${rowsHtml}</div>`;
      }).join("");
      return `<details class="wday"${isToday&&!me?" open":""}><summary>${escH(d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"}))}${isToday?'<span class="tdy">Today</span>':""}<span class="cnt">${total} duties</span></summary>${sessHtml}</details>`;
    }).join("");
  }
  $("#wk-foot").innerHTML=`Same rota as the live check · Built ${escH(APP.built)}`;
}
function showWeek(on){
  document.body.classList.toggle("wk-on",on);
  if(on){ if(!wkMonday) wkMonday=currentWeekMonday(); renderWeek(); window.scrollTo(0,0); }
}
function weekFromHash(){ showWeek(location.hash==="#week"); }
function initWeek(){
  $("#wk-open").onclick=()=>{ if(location.hash!=="#week") location.hash="week"; else showWeek(true); };
  $("#wk-back").onclick=()=>{ try{history.replaceState(null,"",location.pathname+location.search);}catch(e){} showWeek(false); render(); window.scrollTo(0,0); };
  $("#wk-prev").onclick=()=>{stepWeek(-1);renderWeek();};
  $("#wk-next").onclick=()=>{stepWeek(+1);renderWeek();};
  document.querySelectorAll("#wk-quick button").forEach(b=>b.onclick=()=>{
    const cur=iso(currentWeekMonday());
    wkMonday=b.dataset.q==="this"?parseISO(cur):parseISO(SCHOOL_MONDAYS.find(x=>x>cur)||cur);
    renderWeek();
  });
  $("#wk-me").onchange=e=>{setMe(e.target.value);renderWeek();};
  window.addEventListener("hashchange",weekFromHash);
  weekFromHash();
}

/* ---------- init ---------- */
function setBaseToNow(){
  const r=nowSlot(nowDate()); baseSlot=r.slot; liveNow=r.live; rel="now";
}
function init(){
  setBaseToNow();
  tick(); setInterval(tick,15000);
  render();
  document.querySelectorAll(".switch button").forEach(b=>b.onclick=()=>{rel=b.dataset.rel;render();});
  $("#reportbtn").onclick=sendReport;
  $("#reset-btn").onclick=()=>{
    if(!confirm("Clear all present / not-here marks for every session?"))return;
    for(const k in checks) delete checks[k]; saveChecks(); render();
  };
  $("#live-jump").onclick=()=>{setBaseToNow();render();};
  // re-anchor to real "now" every minute so the Now tab stays current
  setInterval(()=>{ if(rel==="now"){const old=slotKey(baseSlot);setBaseToNow();if(slotKey(baseSlot)!==old)render();} },60000);
}
document.addEventListener("DOMContentLoaded",()=>{init();initWeek();});
</script>
